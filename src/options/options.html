<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exp-cloudlab Settings</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>exp-cloudlab Settings</h1>
            <p class="subtitle">Configure your Google Calendar integration</p>
        </header>

        <main>
            <div class="form-group">
                <label for="userIndex">Google Account Index:</label>
                <input type="number" id="userIndex" min="0" placeholder="0" />
                <small class="help-text">
                    Enter the index of your Google account (0 for primary, 1 for secondary, etc.)
                </small>
            </div>

            <div class="actions">
                <button id="saveBtn" class="btn-primary">Save Settings</button>
            </div>

            <div id="status" class="status-message"></div>
        </main>
    </div>

    <script src="../services/storageService.js"></script>
    <script src="optionsController.js"></script>
</body>
</html>
